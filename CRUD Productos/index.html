<!doctype html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

    <title>Hello, world!</title>
</head>

<body>
    <div class="container">
        <div class="d-flex">
            <div class="col-5">
                <h2>FORMULARIO DE REGISTRO</h2>
                <div class="p-1">
                    <div class="mb-3">
                        <label for="exampleFormControlInput1" class="form-label">Nombre del producto</label>
                        <input type="email" class="form-control" id="nombre">
                    </div>
                    <div class="mb-3">
                        <label for="exampleFormControlInput1" class="form-label">Categoria</label>
                        <select type="email" class="form-control" id="categoria">
                            <option value="Verduras">Verduras</option>
                            <option value="Arroz">Arroz</option>
                            <option value="Aseo">Aseo</option>
                            <option value="Carnicos">Carnicos</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="exampleFormControlInput1" class="form-label">Stock</label>
                        <input type="email" class="form-control" id="stock">
                    </div>
                    <div class="mb-3">
                        <label for="exampleFormControlInput1" class="form-label">Precio Compra</label>
                        <input type="email" class="form-control" id="precioC">
                    </div>
                    <div class="mb-3">
                        <label for="exampleFormControlInput1" class="form-label">Iva</label>
                        <select type="email" class="form-control" id="iva">
                            <option value="5">5%</option>
                            <option value="7">7%</option>
                            <option value="10">10%</option>
                            <option value="19">19%</option>
                        </select>

                    </div>
                    <div class="mb-3">
                        <label for="exampleFormControlInput1" class="form-label">Precio de Venta</label>
                        <input type="email" class="form-control" id="precioV">
                    </div>
                    <div>
                        <button onclick="guardarDatos()" class="btn btn-primary col-12">GUARDAR</button>
                    </div>

                </div>
            </div>
            <div class="col-7">
                <H2>LISTADO DE PRODUCTOS</H2>
                <div class="p-2">
                    <table class="table">
                        <thead>
                            <tr>
                                <th scope="col">Iten</th>
                                <th scope="col">Nombre del producto</th>
                                <th scope="col">Stock</th>
                                <th scope="col">Categoria</th>
                                <th scope="col">Precio Compra</th>
                                <th scope="col">IVA</th>
                                <th scope="col">Precio Venta</th>
                                <th scope="col">Estado</th>
                                <th scope="col">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tbody">

                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>


   

    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/alertas.js"></script>
    <script src="assets/main.js"></script>
</body>

</html>
