<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- CDN BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>

<body>

    <div class="container p-4">
        <div class="pl-4 pr-4 d-flex justify-content-between">
            <h2>REGISTRO DE USUARIO</h2>
        </div>
        <div class="mt-5">
            <div class="form-field">
                <label for="exampleFormControlInput1" class="form-label">Tipo de documento</label>
                <select type="text" class="form-control" id="tipoDocumento">
                    <option value="Cedula de ciudadanía">Cedula de ciudadanía</option>
                    <option value="Pasaporte">Pasaporte</option>
                </select>
            </div>
            <div class="form-field">
                <label for="exampleFormControlInput1" class="form-label">Documento</label>
                <input type="number" class="form-control" id="documento">
                <div class="form-text theme-danger">Documento ya registrado</div>
            </div>
            <div class="form-field">
                <label for="exampleFormControlInput1" class="form-label">Nombre Completo</label>
                <input type="text" class="form-control" id="nombre">
            </div>
            <div class="form-field">
                <label for="exampleFormControlInput1" class="form-label">Email</label>
                <input type="text" class="form-control" id="email">
            </div>
            <div class="form-field">
                <label for="exampleFormControlInput1" class="form-label">Telefono</label>
                <input type="text" class="form-control" id="telefono">
            </div>


        </div>
        <button onclick="CrearUsuario()" class=" mt-5 btn-solid theme-primary">Guardar Registro</button>

    </div>



    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>


    <!-- CDN de Sweealert 2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


    <script src="assets/js/alerts.js"></script>
    <script src="assets/js/main.js"></script>
</body>

</html>
